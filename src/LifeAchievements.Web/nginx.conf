server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Blazor needs these two, and nginx does not know them out of the box.
    types {
        application/wasm wasm;
        application/octet-stream dat;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted framework files never change under the same name, so cache hard.
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # These decide which version of the app a returning visitor gets, so never cache them.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Rewritten on container start, so it must never be served stale.
    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else falls back to the SPA, so a deep link like /friends still loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
