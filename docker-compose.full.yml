# The whole thing in containers - the same images that get deployed.
#   docker compose -f docker-compose.full.yml up -d --build
#
# Web on http://localhost:8080, API on http://localhost:8081.
# Credentials come from .env, exactly as in docker-compose.yml.

services:
  postgres:
    image: postgres:17-alpine
    container_name: lifeachievements-db-full
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - lifeachievements-fullstack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/LifeAchievements.Api/Dockerfile
    image: lifeachievements-api:local
    container_name: lifeachievements-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Inside the compose network the database is reachable by service name.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: src/LifeAchievements.Web/Dockerfile
    image: lifeachievements-web:local
    container_name: lifeachievements-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The browser calls this, so it is the address as seen from the host - not "api".
      ApiBaseUrl: "http://localhost:8081"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lifeachievements-fullstack-pgdata:
