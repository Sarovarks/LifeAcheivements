# Render blueprint for the API. Render reads this when you connect the repository as a
# Blueprint (Dashboard -> New -> Blueprint), so the service is defined here rather than
# clicked together in a UI nobody can review.
#
# The database is NOT defined here on purpose: Render's own free Postgres expires, so this
# setup uses Neon's free plan instead and takes the connection string as a secret.

services:
  - type: web
    name: lifeachievements-api
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    branch: main

    dockerfilePath: ./src/LifeAchievements.Api/Dockerfile
    dockerContext: .

    # Liveness only: this one never touches the database, so a database blip does not get
    # the container recycled. /health/ready is the one that checks Postgres.
    healthCheckPath: /health/live

    # Only rebuild when something the API is actually made of has changed.
    buildFilter:
      paths:
        - src/LifeAchievements.Api/**
        - src/LifeAchievements.Application/**
        - src/LifeAchievements.Domain/**
        - src/LifeAchievements.Infrastructure/**
        - src/LifeAchievements.Shared/**
        - render.yaml

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Set in the Render dashboard, never in this file. Neon gives you this string;
      # Npgsql needs it in key=value form, for example:
      #   Host=ep-xxx.ap-southeast-1.aws.neon.tech;Database=lifeachievements;
      #   Username=xxx;Password=xxx;SSL Mode=Require
      - key: ConnectionStrings__Default
        sync: false

      # The GitHub Pages origin - scheme and host only, no path and no trailing slash.
      - key: Cors__AllowedOrigins__0
        value: https://sarovarks.github.io

      # Render hands the container a port here; Program.cs reads it and binds to it.
      - key: PORT
        value: 10000
