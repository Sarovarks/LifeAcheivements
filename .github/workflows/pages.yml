name: Deploy frontend to GitHub Pages

# The Blazor app publishes to plain static files, so GitHub Pages can host it for nothing.
#
# Before the first run, switch Pages on by hand once:
#   Settings -> Pages -> Source -> "GitHub Actions"
# The enablement step below tries to do it automatically, but the workflow token is usually
# not permitted to.
# Then set a repository variable API_BASE_URL to wherever the API lives, e.g.
# https://lifeachievements-api.onrender.com - without it the app has nothing to talk to.

on:
  push:
    branches: [main]
    paths:
      - 'src/LifeAchievements.Web/**'
      - 'src/LifeAchievements.Shared/**'
      - '.github/workflows/pages.yml'
      # This script rewrites the published service worker manifest, so a change to it
      # changes the deployed site just as much as a change to the app does.
      - '.github/scripts/fix_service_worker_integrity.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/LifeAchievements.Web/LifeAchievements.Web.csproj -c Release -o publish

      # Pages serves a project site from /<repo>/, not from the root, so every absolute
      # path the app generates has to be told about that prefix. Read from GITHUB_REPOSITORY
      # rather than written down, so renaming the repository moves the site without a code
      # change - the rename itself still needs a deploy, because a project site does not
      # follow the redirect GitHub leaves behind.
      - name: Point base href at the repository subpath
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "Rewriting <base href> to ${BASE}"
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE}\" />|g" publish/wwwroot/index.html
          grep -o '<base href="[^"]*"' publish/wwwroot/index.html

      # Jekyll runs by default on Pages and silently drops any folder starting with an
      # underscore - which is exactly where Blazor puts _framework. Without this file the
      # site loads and then fails to find the runtime.
      - name: Disable Jekyll
        run: touch publish/wwwroot/.nojekyll

      # Pages has no SPA rewrite rule. Serving index.html as the 404 page is how a deep
      # link like /friends reaches the Blazor router instead of a GitHub 404.
      - name: SPA fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Point the app at the API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::API_BASE_URL repository variable is not set."
            echo "Without it the published app points at http://localhost:5100 - a site that"
            echo "loads, looks completely fine, and silently cannot sign anyone in. Set it"
            echo "under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          printf '{\n  "ApiBaseUrl": "%s"\n}\n' "${API_BASE_URL}" > publish/wwwroot/appsettings.json
          cat publish/wwwroot/appsettings.json

      # index.html and appsettings.json were both edited after publish, so the hashes the
      # service worker recorded for them are now wrong. Left alone, the integrity check
      # fails and the app quietly stops being installable while still appearing to work.
      - name: Re-stamp service worker integrity hashes
        run: python .github/scripts/fix_service_worker_integrity.py publish/wwwroot --exclude _redirects,_headers

      # enablement: true asks the API to switch Pages on. In practice the workflow token was
      # not allowed to do that here, so Pages had to be turned on by hand the first time:
      # Settings -> Pages -> Source -> "GitHub Actions". It is left in because it costs
      # nothing and makes a fresh fork one step easier where the permissions do allow it.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Prove the deployed site really points at the API, rather than trusting that the
      # build step wrote what we think it wrote. A frontend serving a stale or wrong
      # ApiBaseUrl looks perfectly healthy and simply cannot sign anyone in.
      - name: Verify the deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "Checking ${PAGE_URL}"
          for attempt in $(seq 1 10); do
            CONFIG=$(curl -fsS "${PAGE_URL%/}/appsettings.json" 2>/dev/null || true)
            if echo "${CONFIG}" | grep -qF "${API_BASE_URL}"; then
              echo "Live site points at ${API_BASE_URL}"
              exit 0
            fi
            echo "attempt ${attempt}: not updated yet"
            sleep 10
          done
          echo "::error::The deployed appsettings.json does not contain ${API_BASE_URL}."
          echo "Last response was: ${CONFIG}"
          exit 1
